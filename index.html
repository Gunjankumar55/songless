<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Songless — guess the song</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5F1E7;
    --cream-2:#ECE4D2;
    --ink:#18140f;
    --border:#18140f;
    --pink:#E7A6A2;
    --pink-dim:#E7A6A230;
    --olive:#ACA787;
    --olive-dim:#ACA78735;

    /* semantic aliases — light by default, overridden inside .console */
    --void:var(--cream);
    --panel:#ffffff;
    --panel-2:var(--cream-2);
    --line:var(--border);
    --bone:var(--ink);
    --dim:#726b58;
    --green:#6E9A63;
    --green-dim:#6E9A6330;
    --coral:#D9695C;
    --coral-dim:#D9695C30;
    --amber:#c99a45;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background-color:var(--cream);
    background-image:radial-gradient(var(--border) 1px, transparent 1px);
    background-size:22px 22px;
    background-position:-8px -8px;
    color:var(--bone);
    font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; justify-content:center;
    padding:26px 14px 60px; -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Bebas Neue',sans-serif; letter-spacing:.03em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{width:100%; max-width:520px;}
  @media (min-width: 900px){
    #app{max-width:840px;}
    .tabs{flex-wrap:nowrap;}
  }

  header{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--panel); border:2.5px solid var(--border); border-radius:16px;
    padding:12px 18px; margin-bottom:18px; box-shadow:4px 4px 0 var(--border);
  }
  .header-left{display:flex; align-items:center; gap:11px;}
  .logo-mark{
    width:40px; height:40px; flex-shrink:0; background:var(--ink); color:var(--cream);
    border-radius:9px; display:flex; align-items:center; justify-content:center;
    font-size:19px; border:2px solid var(--border);
  }
  header h1{font-size:28px; margin:0; line-height:.85; color:var(--ink);}
  header .tag{font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.13em; margin-top:3px; font-weight:600;}
  .icon-btn{
    background:var(--panel); border:2px solid var(--line); color:var(--bone);
    border-radius:100px; padding:9px 14px; font-size:12.5px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .icon-btn:hover{border-color:var(--dim); transform:translateY(-1px);}
  .icon-btn.active{border-color:var(--green); color:var(--green);}
  .header-actions{display:flex; flex-direction:row; flex-wrap:wrap; justify-content:flex-end; gap:8px; max-width:260px;}

  .import-status{font-size:12px; color:var(--dim); margin:-2px 0 8px; min-height:16px;}
  .import-status.error{color:var(--coral); font-weight:600;}
  .import-status.ok{color:#4a7a3f; font-weight:600;}
  .import-note{font-size:11px; color:var(--dim); line-height:1.5;}
  .import-note b{color:var(--bone);}

  /* ---- category tabs ---- */
  .tabs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
  .tab{
    flex:0 0 auto; background:var(--panel); border:2px solid var(--line); color:var(--bone);
    padding:9px 14px; border-radius:100px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; gap:7px; transition:border-color .15s ease, background .15s ease, transform .15s ease;
  }
  .tab:hover{transform:translateY(-1px);}
  .tab.active{background:var(--ink); color:var(--cream); border-color:var(--ink);}
  .tab-count{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:600;
    background:var(--cream-2); color:inherit; opacity:.85;
    padding:2px 7px; border-radius:100px; border:1px solid var(--line);
  }
  .tab.active .tab-count{background:rgba(255,255,255,0.15); border-color:transparent; opacity:.9;}

  /* ---- the dark "console": everything that plays the actual game ---- */
  .console{
    background:var(--panel); border:3px solid var(--border); border-radius:22px;
    padding:0 0 20px; margin-bottom:4px;
  }
  .console-bar{
    display:flex; align-items:center; gap:10px;
    background:var(--cream-2); border-bottom:3px solid var(--border);
    padding:11px 16px; margin-bottom:22px;
    border-radius:19px 19px 0 0;   /* matches the 22px outer radius minus the 3px border */
  }
  .console-dots{display:flex; gap:6px;}
  .console-dots span{width:10px; height:10px; border-radius:50%; display:inline-block;}
  .console-dots .d1{background:#ff5f56;}
  .console-dots .d2{background:#ffbd2e;}
  .console-dots .d3{background:#27c93f;}
  .console-bar-label{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--dim); font-weight:600;
    letter-spacing:.02em;
  }
  .console-inner{padding:0 18px;}

  /* ---- players panel ---- */
  .players-panel{
    background:var(--panel); border:2px solid var(--line); border-radius:var(--radius);
    overflow:hidden; margin-bottom:16px;
  }
  .panel-bar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--pink); padding:9px 14px; border-bottom:2px solid var(--border);
  }
  .panel-bar h3{
    margin:0; font-size:12.5px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--ink); font-weight:800; display:flex; align-items:center; gap:7px;
  }
  .panel-dots{display:flex; gap:5px;}
  .panel-dots span{width:8px; height:8px; border-radius:50%; background:var(--ink); opacity:.35;}
  .panel-dots span:first-child{background:#D9695C; opacity:.8;}
  .panel-body{padding:14px;}
  .player-add{display:flex; gap:8px; margin-bottom:10px;}
  .player-add input{
    flex:1; background:var(--cream); border:2px solid var(--line); border-radius:10px;
    padding:10px 12px; color:var(--bone); font-size:14px; outline:none;
  }
  .player-add input:focus{border-color:var(--green);}
  .player-add button{
    background:var(--ink); border:2px solid var(--border); color:var(--cream); font-weight:700; border-radius:10px;
    padding:0 16px; cursor:pointer; font-size:14px;
  }
  .player-row{
    display:flex; align-items:center; gap:10px; padding:8px 6px;
    border-top:1px solid var(--line);
  }
  .player-row:first-of-type{border-top:none;}
  .player-row .pname{flex:1; font-size:14px; font-weight:600;}
  .player-row .pscore{font-family:'JetBrains Mono',monospace; font-size:15px; color:var(--green); min-width:26px; text-align:right;}
  .player-row button{
    background:var(--cream-2); border:2px solid var(--line); color:var(--bone);
    border-radius:8px; width:28px; height:28px; cursor:pointer; font-size:15px; line-height:1;
  }
  .player-row button.plus{color:#4a7a3f; border-color:var(--green-dim);}
  .player-row button.remove{color:var(--dim); font-size:13px;}
  .players-empty{font-size:12.5px; color:var(--dim); text-align:center; padding:6px 0;}

  /* ---- attempt boxes ---- */
  .attempts{display:flex; flex-direction:column; gap:8px; margin-bottom:20px;}
  .attempt-box{
    height:44px; border-radius:10px; border:2px solid var(--line); background:var(--panel);
    display:flex; align-items:center; gap:10px; padding:0 14px; font-size:13.5px; color:var(--dim);
    transition:background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .attempt-slot{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; opacity:.6;
    min-width:14px; flex-shrink:0;
  }
  .attempt-text{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .attempt-box.correct{background:var(--green-dim); border-color:var(--green); color:var(--green); font-weight:600;}
  .attempt-box.wrong{background:var(--coral-dim); border-color:var(--coral); color:var(--coral);}
  .attempt-box.skipped{color:var(--dim); font-style:italic;}
  .attempt-box.current{
    border-color:var(--green); background:linear-gradient(90deg, var(--green-dim), transparent 60%);
  }
  .attempt-box.loading{
    background:linear-gradient(90deg, var(--panel) 25%, var(--panel-2) 50%, var(--panel) 75%);
    background-size:200% 100%; animation:shimmer 1.4s linear infinite; border-color:var(--line);
  }
  @keyframes shimmer{ 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
  @media (prefers-reduced-motion: reduce){ .attempt-box.loading{animation:none;} }

  /* ---- duration + bar ---- */
  .dur-label{
    text-align:center; font-family:'JetBrains Mono',monospace; font-size:15px; color:var(--bone);
    margin-bottom:8px;
  }
  .dur-bar{
    display:flex; gap:3px; height:10px; margin-bottom:26px;
  }
  .dur-seg{background:var(--panel-2); border:1px solid var(--line); transition:background .2s ease; min-width:14px; border-radius:4px;}
  .dur-seg.filled{background:var(--green); border-color:var(--green);}

  .live-progress{
    height:5px; border-radius:4px; background:var(--panel-2); overflow:hidden;
    margin:-18px 0 22px; opacity:0; transition:opacity .15s ease;
  }
  .live-progress.active{opacity:1;}
  .live-progress-fill{height:100%; width:0%; background:var(--green); border-radius:4px;}

  /* ---- play button ---- */
  .play-row{display:flex; justify-content:center; margin-bottom:22px;}
  .play-btn{
    width:78px; height:78px; border-radius:50%; background:var(--green); border:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 0 0 0 var(--green-dim); transition:box-shadow .3s ease, transform .1s ease;
    animation:breathe 2.6s ease-in-out infinite;
  }
  .play-btn:active{transform:scale(.95);}
  .play-btn.playing{box-shadow:0 0 0 14px var(--green-dim); animation:none;}
  .play-btn:disabled{opacity:.4; cursor:not-allowed; animation:none;}
  .play-btn svg{margin-left:4px;}
  @keyframes breathe{
    0%,100%{box-shadow:0 0 0 0 var(--green-dim);}
    50%{box-shadow:0 0 0 9px var(--green-dim);}
  }
  @media (prefers-reduced-motion: reduce){
    .play-btn{animation:none;}
  }

  /* ---- search + skip ---- */
  .guess-row{display:flex; gap:8px; position:relative;}
  .search-wrap{flex:1; position:relative;}
  .search-wrap input{
    width:100%; background:var(--panel); border:2px solid var(--line); border-radius:12px;
    padding:14px 16px; color:var(--bone); font-size:14.5px; outline:none;
  }
  .search-wrap input:focus{border-color:var(--bone);}
  .skip-btn{
    background:var(--panel); border:2px solid var(--line); color:var(--bone);
    border-radius:12px; padding:0 20px; font-weight:600; font-size:14px; cursor:pointer;
  }
  .skip-btn:hover{border-color:var(--dim);}
  .suggestions{
    position:absolute; left:0; right:0; top:calc(100% + 6px);
    background:var(--panel-2); border:2px solid var(--line); border-radius:12px;
    overflow:hidden; z-index:60; max-height:240px; overflow-y:auto;
    box-shadow:4px 4px 0 var(--border);
  }
  .sugg-item{padding:11px 14px; font-size:13.5px; cursor:pointer; border-bottom:1px solid var(--line);}
  .sugg-item:last-child{border-bottom:none;}
  .sugg-item:hover{background:var(--panel);}
  .sugg-item .a{color:var(--dim); font-size:12px;}

  /* ---- reveal card ---- */
  .reveal{
    background:var(--panel); border:2px solid var(--line); border-radius:var(--radius);
    padding:20px; text-align:center;
  }
  .reveal .status{font-family:'Bebas Neue',sans-serif; font-size:30px; margin-bottom:4px;}
  .reveal .status.win{color:var(--green);}
  .reveal .status.lose{color:var(--coral);}
  .reveal img{width:88px; height:88px; border-radius:12px; margin:12px 0 10px; object-fit:cover;}
  .reveal .t{font-size:17px; font-weight:700;}
  .reveal .a{font-size:13.5px; color:var(--dim); margin-bottom:16px;}
  .reveal-actions{display:flex; gap:10px;}
  .reveal-actions button{
    flex:1; padding:14px; border-radius:12px; font-weight:700; font-size:14.5px; cursor:pointer; border:none;
  }
  .btn-next{background:var(--ink); color:var(--cream);}
  .btn-hear{background:var(--panel-2); color:var(--bone); border:2px solid var(--line) !important;}

  .status-msg{text-align:center; color:var(--dim); font-size:13px; padding:40px 10px;}

  .home-note{
    margin-top:18px; border-radius:14px; overflow:hidden;
    background:var(--panel); border:2px solid var(--line);
    font-size:12.5px; color:var(--dim); line-height:1.6;
  }
  .home-note .panel-bar{background:var(--olive);}
  .home-note .note-body{padding:14px 16px;}
  .home-note b{color:var(--bone); font-weight:600;}
  .steps-row{display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-bottom:11px;}
  .step{
    background:var(--cream-2); border:1.5px solid var(--border); border-radius:8px;
    padding:5px 10px; font-size:11.5px; font-weight:700; color:var(--ink); white-space:nowrap;
  }
  .step-arrow{color:var(--dim); font-size:13px; opacity:.55;}
  .note-sub{font-size:11.5px; color:var(--dim); line-height:1.5;}
  kbd{
    font-family:'JetBrains Mono',monospace; font-size:10.5px;
    background:var(--cream-2); border:2px solid var(--line); border-bottom-width:3px;
    border-radius:5px; padding:1px 6px; color:var(--bone);
  }
  .site-footer{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    margin-top:22px; padding-top:16px; font-size:12px; color:var(--dim);
  }
  .footer-credit{color:var(--dim); text-decoration:none; transition:color .15s ease;}
  .footer-credit span{color:var(--bone); font-weight:700; background:var(--pink); padding:1px 6px; border-radius:4px; border:1.5px solid var(--border);}
  .footer-credit:hover{color:var(--bone);}
  .visit-counter{
    font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600; color:var(--ink);
    display:inline-flex; align-items:center; gap:5px;
  }
  .visit-counter svg{opacity:.8;}
  .hidden{display:none !important;}

  /* ---- decorative side badges, only when there's real margin to fill ---- */
  .side-deco{
    display:none;
    position:fixed; top:50%; transform:translateY(-50%);
    width:150px; background:var(--panel); border:2.5px solid var(--border); border-radius:14px;
    padding:14px 12px; text-align:center; box-shadow:5px 5px 0 var(--border);
  }
  .left-deco{left:calc(50% - 600px); transform:translateY(-70%) rotate(-5deg);}
  .right-deco{right:calc(50% - 600px); transform:translateY(-30%) rotate(4deg);}
  .deco-num{font-family:'Bebas Neue',sans-serif; font-size:30px; color:var(--ink); line-height:1;}
  .deco-emoji{font-size:28px; margin-bottom:2px;}
  .deco-sub{font-size:11px; color:var(--dim); font-weight:600; line-height:1.35; margin-top:4px;}
  @media (min-width: 1360px){
    .side-deco{display:block;}
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="header-left">
      <div class="logo-mark">♪</div>
      <div>
        <h1 class="display">SONGLESS</h1>
        <div class="tag">guess it from the clip</div>
      </div>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="console">
    <div class="console-bar">
      <div class="console-dots"><span class="d1"></span><span class="d2"></span><span class="d3"></span></div>
      <span class="console-bar-label" id="consoleBarLabel">songless — all</span>
    </div>
    <div class="console-inner">
      <div class="attempts" id="attempts"></div>

      <div class="dur-label" id="durLabel">0.2 seconds</div>
      <div class="dur-bar" id="durBar"></div>

      <div class="live-progress" id="liveProgress"><div class="live-progress-fill" id="liveProgressFill"></div></div>

      <div class="play-row">
        <button class="play-btn" id="btnPlay">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="#0a1a0d"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>

      <div id="guessArea">
        <div class="guess-row">
          <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Search a song" autocomplete="off">
            <div class="suggestions hidden" id="suggestions"></div>
          </div>
          <button class="skip-btn" id="btnSkip">Skip</button>
        </div>
      </div>

      <div id="revealArea" class="hidden"></div>
    </div>
  </div>

  <div class="home-note">
    <div class="panel-bar">
      <h3>How to play</h3>
      <div class="panel-dots"><span></span><span></span><span></span></div>
    </div>
    <div class="note-body">
      <div class="steps-row">
        <span class="step">Hit play</span><span class="step-arrow">→</span>
        <span class="step">Guess or skip</span><span class="step-arrow">→</span>
        <span class="step">Clip gets longer</span><span class="step-arrow">→</span>
        <span class="step">6 tries, 16s max</span>
      </div>
      <div class="note-sub">Press <kbd>Space</kbd> to replay a clip · Open Players to track scores in a group.</div>
    </div>
  </div>

  <footer class="site-footer">
    <a href="https://github.com/Gunjankumar55" target="_blank" rel="noopener noreferrer" class="footer-credit">
      Built by <span>Gunjan</span>
    </a>
  </footer>

</div>
